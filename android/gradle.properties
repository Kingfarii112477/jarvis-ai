org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Several plugins (flutter_timezone, battery_plus, package_info_plus, etc.)
# still ship a Kotlin Gradle Plugin config whose jvmTarget doesn't match
# this app's Java 17 compileOptions. AGP 9 treats that mismatch as a hard
# build failure by default; this downgrades it to a warning, which is the
# officially documented workaround while the plugin ecosystem catches up.
# https://kotlinlang.org/docs/gradle-configure-project.html#check-for-jvm-target-compatibility-of-related-compile-tasks
kotlin.jvm.target.validation.mode=warning
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Must stay false: audio_session, battery_plus, flutter_timezone, flutter_tts,
# package_info_plus, record_android, share_plus and speech_to_text all apply
# the Kotlin Gradle Plugin unconditionally, and AGP 9 hard-errors on that when
# built-in Kotlin is enabled. Any dependency that instead *requires* built-in
# Kotlin (file_picker 11.x does) is therefore incompatible with this app until
# the rest of the ecosystem migrates.
android.builtInKotlin=false
