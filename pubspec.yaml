name: jarvis_app
description: "JARVIS AI — a premium, production-grade AI assistant for Android built with Flutter."
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.1

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local storage & security
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Voice
  record: ^6.0.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1

  # UI / design system
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  flutter_markdown: ^0.7.3
  markdown: ^7.2.2
  flutter_highlight: ^0.7.0

  # Files & content
  # Pinned to 10.x deliberately: 8.x/9.x/10.0 hardcode compileSdk 34 (conflicts
  # with flutter_plugin_android_lifecycle's 36+ requirement), while 11.x drops
  # its own Kotlin plugin and requires android.builtInKotlin=true — which the
  # other 8 Kotlin plugins in this app cannot tolerate under AGP 9.
  file_picker: ^10.3.3
  share_plus: ^10.0.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^3.0.1
  timezone: ^0.10.1

  # System info (dashboard stats)
  battery_plus: ^6.0.2
  package_info_plus: ^8.0.2

  # Data modelling
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  intl: ^0.19.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#05070B"
  adaptive_icon_foreground: "assets/images/app_icon_emblem.png"

flutter:
  uses-material-design: true
  # assets/images/ is deliberately NOT bundled. Those PNGs are build-time
  # inputs for flutter_launcher_icons (read from their source paths above),
  # never loaded at runtime — no Image.asset/AssetImage references them.
  # Listing them here shipped 7.6 MB of dead weight in every APK.
  # Re-add an `assets:` section here if a real runtime asset is introduced.
